services:
  postgres:
    image: postgres:16-alpine
    container_name: scriptor_postgres
    restart: always
    environment:
      POSTGRES_USER: scriptor
      POSTGRES_PASSWORD: scriptor_password
      POSTGRES_DB: scriptor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
